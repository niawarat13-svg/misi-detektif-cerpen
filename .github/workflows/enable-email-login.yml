name: Enable email login
on:
  push:
    branches:
      - student-email-login-v2
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable override script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="student-email-login.js?v=20261004"></script>'
          if tag not in s:
              s=s.replace('<script src="app-cloud.js?v=20260929"></script>', '<script src="app-cloud.js?v=20260929"></script>\n'+tag)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Enable student email login' && git push)